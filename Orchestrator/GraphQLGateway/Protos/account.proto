syntax = "proto3";

option csharp_namespace = "GraphQLGateway.Protos";

package user_service;

import "Protos/models.proto";

service AccountGrpcService {
    rpc GetByPassword (AuthRequest) returns (AccountResponse);
    rpc GetNewRefreshToken (AccountGetter) returns (AccountResponse);
    rpc RevokeRefreshToken (AccountGetter) returns (AccountResponse);
    rpc ChangePassword (AuthRequest) returns (AccountResponse);
	rpc CreateAccount (AuthRequest) returns (AccountResponse);
    rpc GetAccount (AccountGetter) returns (AccountResponse);
    rpc GetAccountList(AccountPageRequest) returns (AccountPageResponse);
    rpc UpdateAccount (AccountRequest) returns (AccountResponse);
    rpc DeleteAccount (AccountGetter) returns (AccountResponse);
    rpc DeletePermanentAccount (AccountGetter) returns (AccountResponse);
}

// ------ Request
message AccountRequest {
    AccountInfo account_info = 1;

    optional bool update_all = 2;
}

message AccountGetter {
    string id = 1;
    optional bool include_badge = 2;
    optional string refresh_token = 3;
}

message AuthRequest {
    string email = 1;
    string password = 2;
}

message AccountQuery {
    optional bool is_verified = 1;
    int32 gender = 2;
    optional string nationality = 3;
    optional string from_date = 4;
    optional string to_date = 5;
    optional string role = 6;
    optional string status = 7;
}

message AccountPageRequest {
    PageQueryRequest page_query_request = 1;
    AccountQuery advance_input = 4;
}

// ------ Response
message AccountResponse {
    ResultResponse result_response = 1;

    // Below is optional return (can be nullable)
    AccountInfo account_info = 2;
    message AccountBadgeResponse {
        AccountBadgeInfo account_badge_info = 1;
        BadgeInfo badge_info = 2;
    }

    repeated AccountBadgeResponse account_badge_response = 3;
}

message AccountPageResponse{
    ResultResponse result_response = 1;

    message AccountPagedResult {
        BasePageResult base_page_result = 1;
        repeated AccountInfo data_list = 2; 
    }
    AccountPagedResult paged_data = 2;
}